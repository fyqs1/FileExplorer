name: FileExplorer
options:
  bundleIdPrefix: com.fyqs
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.fyqs.FileExplorer
    PRODUCT_NAME: FileExplorer
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ONLY_ACTIVE_ARCH: "NO"
    SUPPORTS_MACCATALYST: "NO"
targets:
  FileExplorer:
    type: application
    platform: iOS
    sources:
      - path: FileExplorer
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: FileExplorer/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_ENTITLEMENTS: FileExplorer/FileExplorer.entitlements
    info:
      path: FileExplorer/Info.plist
      properties:
        CFBundleDisplayName: FileExplorer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
